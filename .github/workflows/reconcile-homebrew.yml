name: Reconcile all Homebrew casks

on:
  workflow_dispatch:
  schedule:
    - cron: "19 3 * * *"

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  reconcile:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        product: [butter-paper, caul, dockmint, macsimize, facebook-messenger-desktop, fraia, simple-mac-keyboard-control]
        channel: [stable, beta]
    uses: ./.github/workflows/reconcile-product.yml
    with:
      product: ${{ matrix.product }}
      channel: ${{ matrix.channel }}
    secrets: inherit
