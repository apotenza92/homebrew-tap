name: Test Homebrew publication contract

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - homebrew-products.json
      - scripts/homebrew_publication.py
      - scripts/publish-homebrew.sh
      - scripts/audit_with_retry.py
      - tests/test_release_reliability.py
      - .github/workflows/reconcile-keycontrol.yml
      - scripts/resolve_reconciliation.py
      - tests/test_homebrew_publication.py
      - .github/workflows/publish-homebrew.yml
      - .github/workflows/reconcile-homebrew.yml
      - .github/workflows/reconcile-product.yml
      - .github/workflows/test-homebrew-publication.yml

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests -v
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
