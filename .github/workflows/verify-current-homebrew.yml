name: Verify current immutable Homebrew publication
run-name: ${{ github.event.client_payload.correlation_id || format('manual-current-proof-{0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      product:
        required: true
        type: choice
        options: [butter-paper, caul, dockmint, macsimize, facebook-messenger-desktop, fraia, simple-mac-keyboard-control]
      channel:
        required: true
        type: choice
        options: [stable, beta]
  repository_dispatch:
    types: [verify-current-homebrew-v1]

concurrency:
  group: current-homebrew-proof-${{ github.event.client_payload.product || inputs.product }}-${{ github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate dispatch shape
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          jq -e 'keys | sort == ["channel","correlation_id","product"]' <<<"$PAYLOAD"
          jq -er '.correlation_id | select(test("^[A-Za-z0-9._:/@+-]{1,240}$"))' <<<"$PAYLOAD"
      - name: Fetch the exact public tap verifier inputs without an action dependency
        env:
          PRODUCT: ${{ github.event.client_payload.product || inputs.product }}
          CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          mkdir -p scripts Casks
          curl --fail --location --retry 10 --retry-all-errors "$raw/homebrew-products.json" -o homebrew-products.json
          curl --fail --location --retry 10 --retry-all-errors "$raw/scripts/verify-current-homebrew.py" -o scripts/verify-current-homebrew.py
          cask="$(jq -er --arg product "$PRODUCT" --arg channel "$CHANNEL" '.products[$product][$channel + "_cask"]' homebrew-products.json)"
          [[ "$cask" =~ ^[a-z0-9@-]+\.rb$ ]]
          curl --fail --location --retry 10 --retry-all-errors "$raw/Casks/$cask" -o "Casks/$cask"
          find homebrew-products.json scripts Casks -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > input-SHA256SUMS
      - name: Verify immutable public bytes and exact no-op
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ github.event.client_payload.product || inputs.product }}
          CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
        run: python3 scripts/verify-current-homebrew.py --product "$PRODUCT" --channel "$CHANNEL"
      - name: Prove repository remained unchanged
        run: sha256sum --check --strict input-SHA256SUMS
